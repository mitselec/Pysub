# PySub CI pipeline
#
# Two stages, in the GitLab CI sense:
#   1. lint   - static analysis of the Python source (ruff)
#   2. build  - freeze the program into a self-contained binary with
#               PyInstaller (a Windows exe and a Linux executable)
#               and upload them as downloadable artifacts
#
# The build stage only runs if the lint stage passes ("needs: lint").

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: # allows manual runs from the Actions tab

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linter
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  build:
    name: Build (${{ matrix.os }})
    needs: lint # staged: only builds after lint has passed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: subfetch-exe-windows
            executable: subfetch.exe
          - os: ubuntu-latest
            artifact: subfetch-exe-linux
            executable: subfetch
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary with PyInstaller
        run: python -m PyInstaller --onefile --console --name subfetch subfetch.py

      # --- Windows smoke test ---
      - name: Smoke test the Windows binary (lists languages, saves EN subs)
        if: runner.os == 'Windows'
        run: |
          "https://www.youtube.com/watch?v=dQw4w9WgXcQ`n1" | dist\subfetch.exe *> stdout.txt
          Get-Content stdout.txt
          # assert the subtitle file was produced with actual content
          $srt = Get-ChildItem ~ -Filter *.srt -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $srt) { $srt = Get-ChildItem . -Filter *.srt | Select-Object -First 1 }
          if (-not $srt -or $srt.Length -lt 100) { throw "exe smoke test failed" }

      # --- Linux smoke test ---
      - name: Smoke test the Linux binary (lists languages, saves EN subs)
        if: runner.os == 'Linux'
        run: |
          printf 'https://www.youtube.com/watch?v=dQw4w9WgXcQ\n1\n' | dist/subfetch > stdout.txt 2>&1
          cat stdout.txt
          # assert the subtitle file was produced with actual content
          srt=$(find . -maxdepth 1 -name '*.srt' | head -n 1)
          if [ -z "$srt" ] || [ ! -s "$srt" ]; then echo "binary smoke test failed"; exit 1; fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.executable }}
          retention-days: 14
